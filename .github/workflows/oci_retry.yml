name: OCI Instance Grabber (Zurich)

on:
  schedule:
    # Startet alle 6 Stunden einen neuen 5,5-Stunden-Block (nahtloser Dauerbetrieb)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Erlaubt den manuellen Start am iPad

env:
  SUPPRESS_LABEL_WARNING: "True"
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  run-oci-cli:
    runs-on: ubuntu-latest
    # Erlaubt dem Job, fast die maximalen 6 Stunden von GitHub zu nutzen (350 Min)
    timeout-minutes: 350
    steps:
    - name: Install OCI CLI in User Space
      run: |
        pip install --user oci-cli
        echo "/home/runner/.local/bin" >> $GITHUB_PATH

    - name: Setup OCI Config
      run: |
        rm -rf ~/.oci
        mkdir -p ~/.oci
        echo "[DEFAULT]" > ~/.oci/config
        echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
        echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
        echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
        echo "region=${{ secrets.OCI_REGION }}" >> ~/.oci/config
        echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
        echo "${{ secrets.OCI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem

    - name: 5.5h Continuous 240s Loop
      run: |
        # Schleife läuft 82-mal (82 * 240s = ca. 5,5 Stunden Dauerbetrieb)
        for i in {1..82}
        do
          echo "========================================="
          echo "[BOT] Versuch $i von 82 (Uhrzeit: $(date +'%H:%M:%S'))"
          echo "========================================="
          
          OUTPUT_FILE=$(mktemp)
          
          # Korrigierte Syntax ohne externe Datei für --shape-config
          oci compute instance launch \
            --availability-domain "UocM:EU-ZURICH-1-AD-1" \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --image-id "ocid1.image.oc1.eu-zurich-1.aaaaaaaaekg26xbyq2unwclv466g76p5eul2u233t63ofbeon5yq6j6v6fqa" \
            --subnet-id "ocid1.subnet.oc1.eu-zurich-1.aaaaaaaamnhdcfeo4qlf5kzsy5tjkeze77etmbr6lcyky3v5rfuapdjxb5qa" \
            --assign-public-ip true > "$OUTPUT_FILE" 2>&1 || true
          
          cat "$OUTPUT_FILE"
          
          # Prüfung auf echten Erfolg (kein ServiceError im Output)
          if [ -s "$OUTPUT_FILE" ] && ! grep -q -E "ServiceError|code|message|Error" "$OUTPUT_FILE"; then
            echo "========================================="
            echo "[BOT] !!! ERFOLG !!! Die Ampere-Instanz wurde erstellt!"
            echo "========================================="
            exit 0
          fi
          
          echo "[BOT] Kein Server frei. Nächster Versuch in 240 Sekunden..."
          
          if [ $i -lt 82 ]; then
            sleep 240
          fi
        done
        
        echo "[BOT] 5,5-Stunden-Block beendet. Nächster Block startet automatisch."
        exit 1
