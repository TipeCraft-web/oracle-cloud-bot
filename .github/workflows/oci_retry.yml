name: OCI Instance Grabber (Zurich)

on:
  schedule:
    # Startet alle 6 Stunden einen neuen 5,5-Stunden-Block
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  SUPPRESS_LABEL_WARNING: "True"
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  run-oci-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - name: Install OCI CLI
      run: |
        pip install --user oci-cli
        echo "/home/runner/.local/bin" >> $GITHUB_PATH

    - name: Setup OCI Config
      run: |
        rm -rf ~/.oci
        mkdir -p ~/.oci
        echo "[DEFAULT]" > ~/.oci/config
        echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
        echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
        echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
        echo "region=${{ secrets.OCI_REGION }}" >> ~/.oci/config
        echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
        echo "${{ secrets.OCI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem

    - name: Find Valid Image & Run 5.5h Loop
      run: |
        echo "[BOT] Suche aktuellste Ubuntu 22.04 ARM Image-ID für Zürich..."
        IMAGE_ID=$(oci compute image list \
          --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
          --operating-system "Canonical Ubuntu" \
          --operating-system-version "22.04" \
          --shape "VM.Standard.A1.Flex" \
          --sort-by TIMECREATED \
          --sort-order DESC \
          --query "data[0].id" \
          --raw-output)
        
        echo "[BOT] Gefundene Image-ID: $IMAGE_ID"

        # Schreibt die Shape-Konfiguration als absolut reines JSON ohne Bash-Fehler
        python3 -c 'import json; open("shape.json", "w").write(json.dumps({"ocpus": 2, "memoryInGBs": 12}))'

        for i in {1..82}
        do
          echo "========================================="
          echo "[BOT] Versuch $i von 82 (Uhrzeit: $(date +'%H:%M:%S'))"
          echo "========================================="
          
          OUTPUT_FILE=$(mktemp)
          
          oci compute instance launch \
            --availability-domain "UocM:EU-ZURICH-1-AD-1" \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config file://shape.json \
            --image-id "$IMAGE_ID" \
            --subnet-id "ocid1.subnet.oc1.eu-zurich-1.aaaaaaaamnhdcfeo4qlf5kzsy5tjkeze77etmbr6lcyky3v5rfuapdjxb5qa" \
            --assign-public-ip true > "$OUTPUT_FILE" 2>&1 || true
          
          cat "$OUTPUT_FILE"
          
          if [ -s "$OUTPUT_FILE" ] && ! grep -q -E "ServiceError|code|message|Error" "$OUTPUT_FILE"; then
            echo "========================================="
            echo "[BOT] !!! ERFOLG !!! Die Ampere-Instanz wurde erstellt!"
            echo "========================================="
            exit 0
          fi
          
          echo "[BOT] Kein Server frei. Nächster Versuch in 240 Sekunden..."
          
          if [ $i -lt 82 ]; then
            sleep 240
          fi
        done
        
        echo "[BOT] 5,5-Stunden-Block beendet. Nächster Block startet automatisch."
        exit 1
