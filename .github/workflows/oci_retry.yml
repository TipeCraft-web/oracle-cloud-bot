    - name: Try to Create Ampere Instance in a Loop
      run: |
        echo '{"ocpus": 2, "memoryInGBs": 12}' > shape_config.json
        
        # Startet eine Schleife, die 12-mal läuft (ca. 12-14 Minuten Gesamtlaufzeit)
        for i in {1..12}
        do
          echo "Versuch Nummer $i..."
          
          # Befehl ausführen und die Fehlermeldung in einer Variable speichern
          OUTPUT=$(oci compute instance launch \
            --availability-domain "UocM:EU-ZURICH-1-AD-1" \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config file://shape_config.json \
            --image-id "ocid1.image.oc1.eu-zurich-1.aaaaaaaaekg26xbyq2unwclv466g76p5eul2u233t63ofbeon5yq6j6v6fqa" \
            --subnet-id "ocid1.subnet.oc1.eu-zurich-1.aaaaaaaamnhdcfeo4qlf5kzsy5tjkeze77etmbr6lcyky3v5rfuapdjxb5qa" \
            --assign-public-ip true 2>&1)
          
          echo "$OUTPUT"
          
          # Wenn die Instanz erfolgreich erstellt wurde, beende die Schleife vorzeitig
          if [[ "$OUTPUT" == *"instance"* ]]; then
            echo "Erfolg! Instanz wurde erstellt."
            exit 0
          fi
          
          # Warte 60 Sekunden bis zum nächsten Versuch innerhalb dieses Durchlaufs
          echo "Warte 60 Sekunden..."
          sleep 60
        done
        
        # Wenn nach 12 Versuchen nichts frei war, brich mit Fehler ab (damit GitHub in 15 Min neu startet)
        exit 1
