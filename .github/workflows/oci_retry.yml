name: OCI Instance Grabber (Zurich)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-oci-python:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - name: Install OCI Python SDK
      run: |
        pip install --user oci

    - name: Generate SSH Key Pair
      run: |
        ssh-keygen -t rsa -b 4096 -f ~/.ssh/oci_instance_key -N ""
        echo "[BOT] Neues SSH-Schlüsselpaar wurde erfolgreich generiert."

    - name: Run 5.5h Native Python Grabber
      env:
        OCI_USER: ${{ secrets.OCI_USER_OCID }}
        OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        OCI_REGION: ${{ secrets.OCI_REGION }}
        OCI_KEY: ${{ secrets.OCI_KEY_CONTENT }}
      run: |
        cat << 'EOF' > grabber.py
        import os, time, datetime, oci

        config = {
            "user": os.environ["OCI_USER"].strip(),
            "fingerprint": os.environ["OCI_FINGERPRINT"].strip(),
            "tenancy": os.environ["OCI_TENANCY"].strip(),
            "region": os.environ["OCI_REGION"].strip(),
            "key_content": os.environ["OCI_KEY"].strip()
        }

        # Public SSH Key einlesen
        with open(os.path.expanduser("~/.ssh/oci_instance_key.pub"), "r") as f:
            ssh_public_key = f.read().strip()

        identity = oci.identity.IdentityClient(config)
        compute = oci.core.ComputeClient(config)

        # 1. Echte Availability Domain für dein Konto abfragen
        ads = identity.list_availability_domains(config["tenancy"]).data
        ad_name = ads[0].name
        print(f"[BOT] Echte Availability Domain gefunden: {ad_name}", flush=True)

        # 2. Aktuellstes Ubuntu 22.04 ARM Image für Zürich holen
        images = compute.list_images(
            compartment_id=config["tenancy"],
            operating_system="Canonical Ubuntu",
            operating_system_version="22.04",
            shape="VM.Standard.A1.Flex",
            sort_by="TIMECREATED",
            sort_order="DESC"
        ).data
        image_id = images[0].id
        print(f"[BOT] Gültige Image-ID gefunden: {image_id}", flush=True)

        subnet_id = "ocid1.subnet.oc1.eu-zurich-1.aaaaaaaamnhdcfeo4qlf5kzsy5tjkeze77etmbr6lcyky3v5rfuapdjxb5qa"

        launch_details = oci.core.models.LaunchInstanceDetails(
            availability_domain=ad_name,
            compartment_id=config["tenancy"],
            display_name="ubuntu-ampere-zurich",
            shape="VM.Standard.A1.Flex",
            shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(
                ocpus=2.0,
                memory_in_gbs=12.0
            ),
            source_details=oci.core.models.InstanceSourceViaImageDetails(
                source_type="image",
                image_id=image_id
            ),
            create_vnic_details=oci.core.models.CreateVnicDetails(
                subnet_id=subnet_id,
                assign_public_ip=True
            ),
            metadata={
                "ssh_authorized_keys": ssh_public_key
            }
        )

        # 3. Schleife: 82 Versuche à 240 Sekunden (ca. 5,5 Stunden)
        for i in range(1, 83):
            now = datetime.datetime.now().strftime("%H:%M:%S")
            print(f"\n=========================================", flush=True)
            print(f"[BOT] Versuch {i} von 82 (Uhrzeit: {now})", flush=True)
            print(f"=========================================", flush=True)
            
            try:
                response = compute.launch_instance(launch_details)
                print("[BOT] !!! ERFOLG !!! Die Ampere-Instanz wurde erstellt!", flush=True)
                print(f"Instanz-ID: {response.data.id}", flush=True)
                exit(0)
            except oci.exceptions.ServiceError as e:
                print(f"[BOT] Oracle-Antwort ({e.status} - {e.code}): {e.message}", flush=True)
            except Exception as ex:
                print(f"[BOT] Unerwarteter Fehler: {ex}", flush=True)

            if i < 82:
                print("[BOT] Kein Server frei. Nächster Versuch in 240 Sekunden...", flush=True)
                time.sleep(240)

        print("[BOT] 5,5-Stunden-Block beendet. Nächster Block startet automatisch.", flush=True)
        exit(1)
        EOF

        python3 grabber.py

    - name: Upload Private SSH Key on Success
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: mein-oracle-ssh-key
        path: ~/.ssh/oci_instance_key
        retention-days: 90
