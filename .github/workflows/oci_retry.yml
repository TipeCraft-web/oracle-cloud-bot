name: OCI Instance Grabber (Zurich)

on:
  schedule:
    # Startet den Haupt-Wecker alle 15 Minuten
    - cron: '*/15 * * * *'
  workflow_dispatch: # Erlaubt den manuellen Start am iPad

env:
  SUPPRESS_LABEL_WARNING: "True"
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  run-oci-cli:
    runs-on: ubuntu-latest
    steps:
    - name: Install OCI CLI in User Space
      run: |
        pip install --user oci-cli
        echo "/home/runner/.local/bin" >> $GITHUB_PATH

    - name: Setup OCI Config
      run: |
        rm -rf ~/.oci
        mkdir -p ~/.oci
        echo "[DEFAULT]" > ~/.oci/config
        echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
        echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
        echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
        echo "region=${{ secrets.OCI_REGION }}" >> ~/.oci/config
        echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
        echo "${{ secrets.OCI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem

    - name: Safe 240s Spammer Loop
      run: |
        echo '{"ocpus": 2, "memoryInGBs": 12}' > shape_config.json
        
        # Schleife läuft 3-mal (3 Versuche * 240 Sekunden = 12 Minuten Laufzeit)
        for i in {1..3}
        do
          echo "========================================="
          echo "Distanzierter Versuch Nummer $i von 3..."
          echo "========================================="
          
          # Wir speichern die Antwort UND den echten HTTP-Statuscode ab
          OUTPUT_FILE=$(mktemp)
          HTTP_STATUS=$(oci compute instance launch \
            --availability-domain "UocM:EU-ZURICH-1-AD-1" \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config file://shape_config.json \
            --image-id "ocid1.image.oc1.eu-zurich-1.aaaaaaaaekg26xbyq2unwclv466g76p5eul2u233t63ofbeon5yq6j6v6fqa" \
            --subnet-id "ocid1.subnet.oc1.eu-zurich-1.aaaaaaaamnhdcfeo4qlf5kzsy5tjkeze77etmbr6lcyky3v5rfuapdjxb5qa" \
            --assign-public-ip true > "$OUTPUT_FILE" 2>&1 --raw-output --query "status" || echo "FEHLER")
          
          # Inhalt der Antwort im Log ausgeben
          cat "$OUTPUT_FILE"
          
          # Wir prüfen nun, ob KEIN Fehler im Text ist und der Server wirklich erstellt wurde
          if [ -s "$OUTPUT_FILE" ] && ! grep -q -E "ServiceError|code|message" "$OUTPUT_FILE"; then
            echo "========================================="
            echo "[BOT] !!! ERFOLG !!! Die Ampere-Instanz wurde erfolgreich erstellt!"
            echo "========================================="
            exit 0
          fi
          
          # Nachricht für den echten Fehlschlag nach diesem Versuch
          echo "[BOT] Versuch $i fehlgeschlagen (keine Kapazität oder API-Limit)."
          
          # Warte exakt 240 Sekunden (4 Minuten) bis zum nächsten Versuch
          if [ $i -lt 3 ]; then
            echo "[BOT] Ich schlafe jetzt für 240 Sekunden (4 Minuten)..."
            sleep 240
          fi
        done
        
        # Nachricht für den Fehlschlag am Ende des gesamten 15-Minuten-Durchlaufs
        echo "========================================="
        echo "[BOT] Dieser Durchlauf war erfolglos. Ich warte auf den nächsten Wecker in 15 Minuten..."
        echo "========================================="
        exit 1
